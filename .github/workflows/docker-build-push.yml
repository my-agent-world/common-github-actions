name: common-docker-build-push

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      file:
        required: false
        type: string
        default: Dockerfile
      image:
        required: true
        type: string
      registry:
        required: true
        type: string
      tags:
        required: false
        type: string
        default: sha
      runner:
        required: false
        type: string
        default: ubuntu-latest
      registry-insecure:
        required: false
        type: boolean
        default: false
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: ${{ inputs.registry-insecure && format('[registry."{0}"]\n  http = true\n  insecure = true', inputs.registry) || '' }}
      - uses: docker/login-action@v3
        env:
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        if: env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.tags == 'sha' && github.sha || inputs.tags }}
