name: common-docker-build-push

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      file:
        required: false
        type: string
        default: Dockerfile
      image:
        required: true
        type: string
      registry:
        required: true
        type: string
      tags:
        required: false
        type: string
        default: sha
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.tags == 'sha' && github.sha || inputs.tags }}
