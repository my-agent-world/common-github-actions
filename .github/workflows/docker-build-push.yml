name: common-docker-build-push

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      file:
        required: false
        type: string
        default: Dockerfile
      image:
        required: true
        type: string
      registry:
        required: true
        type: string
      tags:
        required: false
        type: string
        default: sha
      runner:
        required: false
        type: string
        default: ubuntu-latest
      registry-insecure:
        required: false
        type: boolean
        default: false
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Docker daemon
        shell: bash
        run: |
          attempt=1
          while (( attempt <= 60 )); do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          docker info
      - uses: docker/setup-buildx-action@v3
        if: inputs.registry-insecure != true
      - uses: docker/setup-buildx-action@v3
        if: inputs.registry-insecure == true
        with:
          buildkitd-config-inline: |
            [registry."${{ inputs.registry }}"]
              http = true
              insecure = true
      - uses: docker/login-action@v3
        env:
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        if: env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.tags == 'sha' && github.sha || inputs.tags }}
