name: common-node-platform-ci

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: 22.x
      verify-command:
        required: true
        type: string
      package-command:
        required: false
        type: string
        default: ''
      pre-verify-command:
        required: false
        type: string
        default: ''
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run platform pre-verification
        if: inputs.pre-verify-command != ''
        run: ${{ inputs.pre-verify-command }}
      - name: Run repository verification
        run: ${{ inputs.verify-command }}
      - name: Package artifact
        if: inputs.package-command != ''
        run: ${{ inputs.package-command }}
