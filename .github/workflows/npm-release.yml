name: common-npm-release

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: 22.x
      working-directory:
        required: false
        type: string
        default: .
      verify-command:
        required: false
        type: string
        default: npm test
      publish-command:
        required: false
        type: string
        default: npm publish
    secrets:
      npm-token:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify package
        run: ${{ inputs.verify-command }}
      - name: Publish package
        run: ${{ inputs.publish-command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
